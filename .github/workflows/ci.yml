name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regress:
    # the extension against each PostgreSQL major version it supports: the
    # custom scan carries version guards for 16, 17 and 18
    name: Regression (PostgreSQL ${{ matrix.pg }})
    runs-on: ubuntu-24.04
    # a run takes 2-3 minutes once PostgreSQL is installed, and the install
    # has taken 20 s to 16 min; without a limit a stalled one holds the job
    # for GitHub's default of 6 hours
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "17", "18"]
    env:
      PG: ${{ matrix.pg }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PostgreSQL from apt.postgresql.org
        timeout-minutes: 35
        run: |
          # The mirror is sometimes slow and sometimes stalls. apt gives up on
          # a connection silent for 60 s and retries it itself; a whole step
          # still stuck after 10 minutes is killed and run again, up to three
          # times. Downloaded packages are kept, so a retry resumes.
          apt_opts=(-o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60)
          retry() {
            for attempt in 1 2 3; do
              sudo timeout 600 "$@" && return 0
              echo "::warning::attempt $attempt of 3 failed: $*"
              sudo dpkg --configure -a || true
              sleep 15
            done
            return 1
          }
          retry apt-get "${apt_opts[@]}" update -qq
          retry apt-get "${apt_opts[@]}" install -y -qq postgresql-common
          retry /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          retry apt-get "${apt_opts[@]}" install -y -qq "postgresql-$PG" "postgresql-server-dev-$PG"
      - name: Build, install and run the regression suite
        run: .github/ci/pg-regress.sh "$PG"
      - name: Keep the regression output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regression-pg${{ matrix.pg }}
          path: |
            ext/test/regression.diffs
            ext/test/regression.out
            ext/test/results/
          if-no-files-found: ignore

  selftest:
    # the HEALPix and covering code on its own: no PostgreSQL needed
    name: Geometry selftests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make -C ext selftest

  adql-geometry:
    # the reference translators: their tests, and Python and Java agreeing
    # byte for byte on every case
    name: adql_geometry (Python and Java)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python tests
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q pytest
          "$RUNNER_TEMP/venv/bin/python" -m pytest -q adql_geometry/tests
      - name: Python and Java agree
        run: |
          javac -d "$RUNNER_TEMP/classes" adql_geometry/java/SkycellAdqlGeometry.java
          SKYCELL_JAVA_CLASSES="$RUNNER_TEMP/classes" python3 adql_geometry/tests/cross_check.py
